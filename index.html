<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallet (test mode)</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<style>
:root{--bg:#f3f6f1;--ink:#14231a;--card:#fff;--line:#cfd9cc;--green:#1f7a43;--amber:#b7791f;--red:#b42318}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:460px;margin:0 auto;padding:16px}
h1{font-size:20px;margin-bottom:4px}h2{font-size:15px;margin-bottom:8px}
.test{font-size:13px;color:var(--amber);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
input,button{width:100%;font:inherit;padding:11px;margin:5px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{background:var(--green);color:#fff;border:0;font-weight:600;cursor:pointer} button:disabled{opacity:0.6}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:var(--red)}
.bal{font-size:34px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.row:first-child{border-top:0}
#msg{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:12px 16px;font-size:15px;font-weight:600;background:var(--amber);color:#fff}
#msg:empty{display:none}
body{padding-bottom:70px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:16px;width:min(92vw,400px)}dialog::backdrop{background:rgba(0,0,0,.5)}.sum{font-size:18px;font-weight:700;margin:6px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Wallet</h1>
<p class="test">Test mode: sandbox money only. Not licensed for real customers.</p>
<p id="msg" role="status"></p>

<section id="authBox" class="card">
<div id="custAuth">
<h2>Sign in or create a wallet</h2>
<input id="phone" inputmode="numeric" placeholder="Phone, e.g. 0712345678" value="0790928450">
<input id="name" placeholder="Your name (new wallets only)" value="Collins Letting">
<input id="pin" type="password" inputmode="numeric" placeholder="PIN, at least 6 digits e.g. 123456">
<button id="loginBtn">Sign in</button>
<button id="regBtn" class="alt">Create wallet</button>
<button id="toAdmin" class="alt">Admin sign in</button>
</div>
<div id="adminAuth" hidden>
<h2>Admin sign in</h2>
<input id="aemail" type="email" placeholder="Admin email">
<input id="apass" type="password" placeholder="Password">
<button id="adminBtn">Sign in as admin</button>
<button id="toCust" class="alt">Back to customer</button>
</div>
</section>

<section id="custView" hidden>
<div class="card"><div id="who"></div><div class="bal">Ksh <span id="bal">0</span></div></div>
<div class="card"><h2>Add money</h2><input id="addAmt" type="number" min="10" placeholder="Amount in Ksh"><button id="addBtn">Send M-Pesa prompt (needs Functions)</button></div>
<div class="card"><h2>Send money (Ksh 3 fee)</h2><input id="to" inputmode="numeric" placeholder="Receiver phone"><input id="amt" type="number" min="10" placeholder="Amount"><button id="sendBtn">Send</button></div>
<div class="card"><h2>Change PIN</h2><input id="oldPin" type="password" placeholder="Current PIN"><input id="newPin" type="password" placeholder="New PIN 6-12 digits"><button id="chBtn" class="alt">Change PIN</button></div>
<div class="card"><h2>History</h2><div id="hist"></div></div>
<button class="alt" data-out>Sign out</button>
</section>

<section id="adminView" hidden>
<div class="card"><h2>Admin Dashboard</h2><div id="adminInfo">Admin view</div></div>
<button class="alt" data-out>Sign out</button>
</section>

<dialog id="confirm"><h2>Confirm transfer</h2><div class="sum" id="cSum"></div><p id="cFee"></p><input id="cPin" type="password" placeholder="Enter PIN"><p id="cErr" style="color:red;min-height:20px"></p><button id="cYes">Confirm and send</button><button id="cNo" class="alt">Cancel</button></dialog>

<script>
// YOUR REAL FIREBASE CONFIG - FIXED
firebase.initializeApp({
  apiKey: "AIzaSyA3rqKiUrn1Tr7gvo03VMGYEzJgG2QGqtQ",
  authDomain: "amazinggracecomments-e68ea.firebaseapp.com",
  databaseURL: "https://amazinggracecomments-e68ea-default-rtdb.firebaseio.com",
  projectId: "amazinggracecomments-e68ea",
  storageBucket: "amazinggracecomments-e68ea.firebasestorage.app",
  messagingSenderId: "494112674814",
  appId: "1:494112674814:web:abc6a684436bf7490b26af"
});

const auth = firebase.auth(), db = firebase.database(), fn = firebase.functions();
const $ = (id) => document.getElementById(id);
const say = (t) => { $("msg").textContent = t; setTimeout(()=>{ if($("msg").textContent===t) $("msg").textContent=""; },4000); };
const fail = (e) => { console.log(e); say(e.message || "Error"); };
const mail = (p) => p.trim() + "@collinspesa.app";
const PHONE = /^(07|01)\d{8}$/;
let stop=[];

function show(view){
  $("authBox").hidden = view !== null;
  $("custView").hidden = view !== "cust";
  $("adminView").hidden = view !== "admin";
}

// === FIXED BUTTONS - NOW SENSE CLICKS 100% ===
$("toAdmin").onclick = ()=>{
  $("custAuth").hidden=true;
  $("adminAuth").hidden=false;
  say("Admin sign in - enter admin email");
};
$("toCust").onclick = ()=>{
  $("custAuth").hidden=false;
  $("adminAuth").hidden=true;
  say("");
};

$("regBtn").onclick = async ()=>{
  const phone=$("phone").value.trim(), name=$("name").value.trim(), pin=$("pin").value.trim();
  if(!PHONE.test(phone)) return say("Enter valid phone e.g. 0790928450");
  if(!name) return say("Enter your name Collins Letting");
  if(pin.length < 6) return say("PIN must be 6 digits e.g. 123456, you typed "+pin.length);
  
  $("regBtn").disabled=true;
  say("Creating wallet for "+phone+"...");
  try{
    const cred = await auth.createUserWithEmailAndPassword(mail(phone), pin);
    await db.ref("users/"+cred.user.uid).set({
      phone: phone,
      name: name,
      balance: 203,
      createdAt: Date.now()
    });
    say("✅ Wallet created! Balance 203 Ksh - Opening...");
  }catch(e){
    fail(e);
    if(e.code==="auth/email-already-in-use") say("Phone "+phone+" already exists - Click Sign in with PIN 123456");
  }
  $("regBtn").disabled=false;
};

$("loginBtn").onclick = async ()=>{
  const phone=$("phone").value.trim(), pin=$("pin").value.trim();
  if(!PHONE.test(phone)) return say("Enter phone 0790928450");
  if(pin.length < 6) return say("PIN 6 digits e.g. 123456");
  
  $("loginBtn").disabled=true;
  say("Signing in "+phone+"...");
  try{
    await auth.signInWithEmailAndPassword(mail(phone), pin);
    say("✅ Signed in!");
  }catch(e){
    fail(e);
    say(e.code==="auth/too-many-requests"?"Too many tries. Wait 2 min.":"Wrong phone or PIN. If you just created, use 123456");
  }
  $("loginBtn").disabled=false;
};

$("adminBtn").onclick = async ()=>{
  const email=$("aemail").value.trim(), pass=$("apass").value;
  if(!email || !pass) return say("Enter admin email and password");
  $("adminBtn").disabled=true;
  say("Checking admin...");
  try{
    await auth.signInWithEmailAndPassword(email, pass);
    say("Admin signed in");
  }catch(e){ say("Wrong admin email/password"); }
  $("adminBtn").disabled=false;
};

document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>auth.signOut());

// Simple wallet actions without Cloud Functions
$("addBtn").onclick = ()=>say("M-Pesa STK needs Cloud Functions deployed - Balance is test mode 203 for now");
$("sendBtn").onclick = ()=>{
  const to=$("to").value.trim(), amount=Number($("amt").value);
  if(!PHONE.test(to)) return say("Enter valid receiver phone");
  if(!amount || amount<10) return say("Amount at least 10");
  $("cSum").textContent=`Send Ksh ${amount} to ${to}`;
  $("cFee").textContent=`Fee 3. Total ${amount+3}`;
  $("cPin").value=""; $("cErr").textContent=""; $("confirm").showModal();
};
$("cNo").onclick = ()=>$("confirm").close();
$("cYes").onclick = async ()=>{
  $("cYes").disabled=true;
  try{
    // Simple local transfer demo - deduct balance
    const to=$("to").value.trim(), amount=Number($("amt").value);
    const u=auth.currentUser;
    const snap=await db.ref("users/"+u.uid).get();
    let bal=snap.val().balance;
    if(bal < amount+3) throw new Error("Low balance. You have "+bal);
    await db.ref("users/"+u.uid+"/balance").set(bal - (amount+3));
    // log transfer
    await db.ref("userTransfers/"+u.uid).push({to, amount, fee:3, status:"SENT", at:Date.now()});
    $("confirm").close();
    $("amt").value=""; $("to").value="";
    say("✅ Sent Ksh "+amount+" to "+to);
  }catch(e){ $("cErr").textContent=e.message; }
  $("cYes").disabled=false;
};
$("chBtn").onclick = async ()=>{
  const oldPin=$("oldPin").value, newPin=$("newPin").value;
  if(newPin.length < 6) return say("New PIN 6+ digits");
  try{
    const user=auth.currentUser;
    await user.updatePassword(newPin);
    say("PIN changed to "+newPin+" - Sign in again");
    setTimeout(()=>auth.signOut(),1000);
  }catch(e){ say("Change PIN needs re-login. Sign out and sign in again, then change."); }
};

// AUTH STATE
auth.onAuthStateChanged(async (u)=>{
  stop.forEach(f=>f()); stop=[];
  show(null);
  if(!u) return;
  const tok=await u.getIdTokenResult(true);
  if(tok.claims.admin){
    show("admin");
    $("adminInfo").textContent="Admin: "+u.email;
  }else{
    show("cust");
    const listen = (ref, cb)=>{ ref.on("value", cb); stop.push(()=>ref.off("value",cb)); };
    listen(db.ref("users/"+u.uid), (s)=>{
      const d=s.val();
      if(d){
        $("who").textContent=d.name+" · "+d.phone;
        $("bal").textContent=d.balance;
      }else{
        $("who").textContent="Setting up wallet...";
      }
    });
    listen(db.ref("userTransfers/"+u.uid).limitToLast(20), (s)=>{
      const h=$("hist"); h.innerHTML="";
      if(!s.exists()){ h.innerHTML="No transactions yet."; return; }
      s.forEach(c=>{
        const t=c.val();
        const div=document.createElement("div");
        div.className="row";
        div.textContent=`- Ksh ${t.amount+t.fee} to ${t.to} (${t.status})`;
        h.appendChild(div);
      });
    });
  }
});
</script>
</body>
</html>
