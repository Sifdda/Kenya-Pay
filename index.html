<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallet (test mode)</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<style>
:root{--bg:#f3f6f1;--ink:#14231a;--card:#fff;--line:#cfd9cc;--green:#1f7a43;--amber:#b7791f;--red:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a13;--ink:#e6f2e8;--card:#16251b;--line:#2a3d30;--green:#4cc27a;--amber:#e0a93b;--red:#f07167}}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:460px;margin:0 auto;padding:16px}
h1{font-size:20px;margin-bottom:4px}h2{font-size:15px;margin-bottom:8px}
.test{font-size:13px;color:var(--amber);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
input,button{width:100%;font:inherit;padding:11px;margin:5px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{background:var(--green);color:#fff;border:0;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:var(--red)}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.bal{font-size:34px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.row:first-child{border-top:0}.row div button{width:auto;padding:6px 10px;margin:0 0 0 4px;font-size:13px}
#msg{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:12px 16px;font-size:15px;font-weight:600;background:var(--amber);color:#fff}
#msg:empty{display:none}
body{padding-bottom:70px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Wallet</h1>
<p class="test">Test mode: sandbox money only. Not licensed for real customers.</p>
<p id="msg" role="status"></p>

<section id="authBox" class="card">
  <div id="custAuth">
    <h2>Sign in or create a wallet</h2>
    <input id="phone" inputmode="numeric" placeholder="Phone, e.g. 0712345678" autocomplete="username">
    <input id="name" placeholder="Your name (new wallets only)">
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN, at least 6 digits" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <button id="regBtn" class="alt">Create wallet</button>
    <button id="toAdmin" class="alt">Admin sign in</button>
  </div>
  <div id="adminAuth" hidden>
    <h2>Admin sign in</h2>
    <input id="aemail" type="email" placeholder="Admin email" autocomplete="username">
    <input id="apass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="adminBtn">Sign in as admin</button>
    <button id="toCust" class="alt">Back</button>
  </div>
</section>

<section id="custView" hidden>
  <div class="card"><div id="who"></div><div class="bal">Ksh <span id="bal">0</span></div></div>
  <div class="card"><h2>Add money</h2>
    <input id="addAmt" type="number" min="10" placeholder="Amount in Ksh">
    <button id="addBtn">Send M-Pesa prompt to my phone</button></div>
  <div class="card"><h2>Send money (Ksh 3 fee)</h2>
    <input id="to" inputmode="numeric" placeholder="Receiver phone">
    <input id="amt" type="number" min="10" placeholder="Amount in Ksh">
    <button id="sendBtn">Send</button></div>
  <div class="card"><h2>Recent transfers</h2><div id="hist"></div></div>
  <button class="alt" data-out>Sign out</button>
</section>

<section id="adminView" hidden>
  <div class="card"><h2>Queued transfers</h2><div id="queue"></div></div>
  <button class="alt" data-out>Sign out</button>
</section>

<script>
if (typeof firebase === "undefined") {
  document.getElementById("msg").textContent = "Cannot load Firebase. Check your internet connection and reload.";
  throw new Error("Firebase library not loaded");
}
// Paste your NEW Firebase project's web config here (Project settings > Your apps).
firebase.initializeApp({
  apiKey: "PASTE", authDomain: "PASTE.firebaseapp.com", databaseURL: "PASTE",
  projectId: "PASTE", appId: "PASTE"
});
const auth = firebase.auth(), db = firebase.database(), fn = firebase.functions();
const $ = (id) => document.getElementById(id);
const call = (name, data) => fn.httpsCallable(name)(data).then((r) => r.data);
const say = (t) => { $("msg").textContent = t; };
const fail = (e) => say(e && e.message ? e.message : "Something went wrong. Try again.");
if (firebase.app().options.apiKey === "PASTE") say("Not set up yet: paste your Firebase config into index.html.");
const mail = (p) => p.trim() + "@collinspesa.app";
const PHONE = /^(07|01)\d{8}$/;
let stop = [];

function show(view) {
  $("authBox").hidden = view !== null;
  $("custView").hidden = view !== "cust";
  $("adminView").hidden = view !== "admin";
}
function row(text, buttons) {
  const r = document.createElement("div"); r.className = "row";
  const s = document.createElement("span"); s.textContent = text; r.appendChild(s);
  if (buttons) { const d = document.createElement("div"); buttons.forEach((b) => d.appendChild(b)); r.appendChild(d); }
  return r;
}
function btn(label, cls, fnc) {
  const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls; b.onclick = fnc; return b;
}
function listen(ref, cb) { ref.on("value", cb); stop.push(() => ref.off("value", cb)); }

$("toAdmin").onclick = () => { $("custAuth").hidden = true; $("adminAuth").hidden = false; say(""); };
$("toCust").onclick = () => { $("custAuth").hidden = false; $("adminAuth").hidden = true; say(""); };

$("regBtn").onclick = async () => {
  const phone = $("phone").value.trim(), name = $("name").value.trim(), pin = $("pin").value;
  if (!PHONE.test(phone) || !name || pin.length < 6) return say("Enter a valid phone, your name and a PIN of 6+ digits.");
  try {
    await auth.createUserWithEmailAndPassword(mail(phone), pin);
    await call("setupProfile", { name, phone });
    say("");
  } catch (e) { fail(e); }
};
$("loginBtn").onclick = async () => {
  const phone = $("phone").value.trim();
  if (!PHONE.test(phone)) return say("Enter a valid phone number.");
  try { await auth.signInWithEmailAndPassword(mail(phone), $("pin").value); say(""); }
  catch (e) { say("Wrong phone or PIN."); }
};
$("adminBtn").onclick = async () => {
  try { await auth.signInWithEmailAndPassword($("aemail").value.trim(), $("apass").value); say(""); }
  catch (e) { say("Wrong email or password."); }
};
document.querySelectorAll("[data-out]").forEach((b) => (b.onclick = () => auth.signOut()));

$("addBtn").onclick = async () => {
  try { await call("stkPush", { amount: $("addAmt").value }); say("Check your phone and enter your M-Pesa PIN. Your balance updates automatically."); }
  catch (e) { fail(e); }
};
$("sendBtn").onclick = async () => {
  try { await call("sendMoney", { to: $("to").value.trim(), amount: $("amt").value }); say("Transfer queued."); $("amt").value = ""; }
  catch (e) { fail(e); }
};

auth.onAuthStateChanged(async (u) => {
  stop.forEach((f) => f()); stop = [];
  show(null);
  if (!u) return;
  const tok = await u.getIdTokenResult(true);
  if (tok.claims.admin === true) {
    show("admin");
    listen(db.ref("transfers").orderByChild("status").equalTo("QUEUED"), (s) => {
      const q = $("queue"); q.replaceChildren();
      if (!s.exists()) return q.appendChild(row("No queued transfers."));
      s.forEach((c) => {
        const t = c.val(), id = c.key;
        q.appendChild(row(`Ksh ${t.amount} to ${t.to}`, [
          btn("Sent", "", () => call("adminResolve", { id, status: "SENT" }).catch(fail)),
          btn("Refund", "danger", () => call("adminResolve", { id, status: "REFUNDED" }).catch(fail)),
        ]));
      });
    });
  } else {
    show("cust");
    listen(db.ref("users/" + u.uid), (s) => {
      const d = s.val();
      $("who").textContent = d ? d.name + " · " + d.phone : "Setting up your wallet...";
      $("bal").textContent = d ? d.balance : 0;
    });
    listen(db.ref("userTransfers/" + u.uid).limitToLast(10), (s) => {
      const h = $("hist"); h.replaceChildren();
      if (!s.exists()) return h.appendChild(row("No transfers yet."));
      const items = []; s.forEach((c) => { items.unshift(c.val()); });
      items.forEach((t) => h.appendChild(row(`Ksh ${t.amount} to ${t.to}`, [Object.assign(document.createElement("small"), { textContent: t.status })])));
    });
  }
});
</script>
</body>
</html>
