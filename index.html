<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collins Wallet</title>
<meta name="theme-color" content="#1f7a43">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2830/2830284.png">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0} body{font:16px/1.5 system-ui,sans-serif;background:#f3f6f1;max-width:460px;margin:0 auto;padding:16px;padding-bottom:90px}
.card{background:#fff;border:1px solid #cfd9cc;border-radius:12px;padding:14px;margin:12px 0}
input,button{width:100%;font:inherit;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #cfd9cc}
button{background:#1f7a43;color:#fff;border:0;font-weight:700}
button.install{background:#1a73e8;font-size:20px;padding:20px;position:sticky;top:0;z-index:999;box-shadow:0 6px 16px rgba(0,0,0,.3)}
button.alt{background:#fff;color:#14231a} button.link{background:transparent;color:#1f7a43;text-decoration:underline;border:0}
#msg{position:fixed;left:0;right:0;bottom:0;z-index:999;padding:14px;background:#1f7a43;color:#fff;font-weight:700;text-align:center} #msg:empty{display:none}
[hidden]{display:none!important}
.instruct{background:#fff8e1;border:2px solid #f9a825;padding:14px;border-radius:10px;font-size:14px;line-height:1.6;margin:10px 0}
.bal{font-size:34px;font-weight:800}
</style>
</head>
<body>

<button id="installBtn" class="install">📲 TAP HERE TO ADD TO HOME SCREEN</button>
<div id="instruct" class="instruct" style="display:none"></div>

<h1>Collins Wallet</h1>
<p id="msg"></p>

<section id="authBox" class="card">
<div id="custAuth">
<h2>Sign in</h2>
<input id="phone" value="0790928450">
<input id="name" value="Collins Letting">
<input id="pin" type="password" placeholder="PIN 123456">
<button id="loginBtn">Sign in</button>
<button id="regBtn" class="alt">Create wallet</button>
<button id="forgotLink" class="link">Forgot PIN?</button>
</div>
<div id="forgotBox" hidden>
<h2>Reset PIN</h2>
<input id="fPhone" value="0790928450"><input id="fNewPin" type="password" placeholder="New PIN 123456">
<button id="fResetBtn">Set New PIN</button><button id="fBack" class="alt">Back</button>
</div>
</section>

<section id="custView" hidden>
<div class="card"><div id="who"></div><div class="bal">Ksh <span id="bal">0</span></div></div>
<button class="alt" data-out>Sign out</button>
</section>

<script>
// === MAKE IT INSTALLABLE AS APP SHORTCUT ===
const manifest = {
  name: "Collins Wallet",
  short_name: "Wallet",
  start_url: ".",
  display: "standalone",
  background_color: "#f3f6f1",
  theme_color: "#1f7a43",
  icons: [{src:"https://cdn-icons-png.flaticon.com/512/2830/2830284.png",sizes:"512x512",type:"image/png"}]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
const manifestURL = URL.createObjectURL(manifestBlob);
const link = document.createElement('link');
link.rel = 'manifest';
link.href = manifestURL;
document.head.appendChild(link);

// Service worker to allow install
if('serviceWorker' in navigator){
  const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>{})));`;
  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swURL = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL);
}

let deferredPrompt=null;
const $=id=>document.getElementById(id);
const say=t=>{$("msg").textContent=t;setTimeout(()=>{$("msg").textContent="";},6000);};

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  $("installBtn").textContent="📲 INSTALL NOW - TAP TO ADD ICON!";
  $("installBtn").style.background="#1f7a43";
  $("instruct").style.display="block";
  $("instruct").innerHTML="✅ <b>Ready to install!</b> Tap button above → Tap <b>Install</b> → Icon appears on home screen like MPESA";
});

$("installBtn").onclick=async()=>{
  const instruct=$("instruct");
  if(deferredPrompt){
    deferredPrompt.prompt();
    const {outcome}=await deferredPrompt.userChoice;
    if(outcome==='accepted'){
      say("✅ Added! Check home screen - Find Wallet icon");
      $("installBtn").textContent="✅ Added to Home Screen!";
      instruct.innerHTML="✅ <b>Done!</b> Go to home screen → You will see <b>Collins Wallet</b> icon. Tap it to open wallet. It works offline like real app!";
      instruct.style.background="#d4edda";
      instruct.style.borderColor="#1f7a43";
    } else {
      say("Tap again to install");
    }
    deferredPrompt=null;
  } else {
    // Manual install - works 100% on all phones
    const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
    instruct.style.display="block";
    if(isIOS){
      instruct.innerHTML=`<b>📱 iPhone - Add Shortcut:</b><br>
      1. Tap Share button ⬆️ at bottom (square with arrow)<br>
      2. Scroll down → Tap <b>Add to Home Screen</b><br>
      3. Tap <b>Add</b> top right<br>
      ✅ Wallet icon appears on home screen!`;
      say("iPhone: Share ⬆️ → Add to Home Screen");
    } else {
      instruct.innerHTML=`<b>📱 Android - Add Shortcut:</b><br>
      1. Tap <b>⋮</b> 3 dots top right corner<br>
      2. Tap <b>Add to Home screen</b> or <b>Install app</b><br>
      3. Tap <b>Add</b> then <b>Install</b><br>
      ✅ Wallet icon appears on home screen like MPESA!<br><br>
      <b>Shortcut created!</b> You can now open wallet from home screen icon.`;
      say("Tap ⋮ menu → Add to Home screen");
    }
  }
};

// Auto-show instructions if no prompt after 2 sec
setTimeout(()=>{
  if(!deferredPrompt && $("instruct").style.display==="none"){
    $("instruct").style.display="block";
    $("instruct").innerHTML="<b>📲 To add shortcut:</b> Tap button above, or Chrome menu ⋮ → Add to Home screen → Install. Icon will appear on home screen.";
  }
},2000);

firebase.initializeApp({apiKey:"AIzaSyA3rqKiUrn1Tr7gvo03VMGYEzJgG2QGqtQ",authDomain:"amazinggracecomments-e68ea.firebaseapp.com",databaseURL:"https://amazinggracecomments-e68ea-default-rtdb.firebaseio.com",projectId:"amazinggracecomments-e68ea",storageBucket:"amazinggracecomments-e68ea.firebasestorage.app",messagingSenderId:"494112674814",appId:"1:494112674814:web:abc6a684436bf7490b26af"});
const auth=firebase.auth(),db=firebase.database();
const mail=p=>p.trim()+"@collinspesa.app";
const PHONE=/^(07|01)\d{8}$/;
function show(v){$("authBox").hidden=v!==null;$("custView").hidden=v!=="cust";}
$("forgotLink").onclick=()=>{$("custAuth").hidden=true;$("forgotBox").hidden=false;};
$("fBack").onclick=()=>{$("custAuth").hidden=false;$("forgotBox").hidden=true;};
$("regBtn").onclick=async()=>{const ph=$("phone").value.trim(),nm=$("name").value.trim(),pin=$("pin").value.trim();try{const c=await auth.createUserWithEmailAndPassword(mail(ph),pin);await db.ref("users/"+c.user.uid).set({phone:ph,name:nm,balance:203});say("✅ Created");}catch(e){say(e.message);}};
$("loginBtn").onclick=async()=>{const ph=$("phone").value.trim(),pin=$("pin").value.trim();try{await auth.signInWithEmailAndPassword(mail(ph),pin);say("✅ Signed in");}catch(e){say("Wrong PIN");}};
$("fResetBtn").onclick=async()=>{const ph=$("fPhone").value.trim(),np=$("fNewPin").value.trim();try{await db.ref("resetRequests").push({phone:ph,newPin:np});say("✅ Saved - Delete user "+ph+"@collinspesa.app in Console then Create");}catch(e){say(e.message);}};
document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>auth.signOut());
auth.onAuthStateChanged(u=>{show(null);if(!u)return;show("cust");db.ref("users/"+u.uid).on("value",s=>{const d=s.val();if(d){$("who").textContent=d.name+" · "+d.phone;$("bal").textContent=d.balance;}});});
</script>
</body>
</html>
