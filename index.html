<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallet - Admin Fixed for Collins</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f3f6f1;--ink:#14231a;--card:#fff;--line:#cfd9cc;--green:#1f7a43;--amber:#b7791f}
*{box-sizing:border-box;margin:0} body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:460px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
input,button{width:100%;font:inherit;padding:11px;margin:5px 0;border-radius:8px;border:1px solid var(--line)}
button{background:var(--green);color:#fff;border:0;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)} button.link{background:transparent;color:var(--green);border:0;text-decoration:underline;font-size:14px}
#msg{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:12px 16px;font-weight:600;background:var(--amber);color:#fff} #msg:empty{display:none}
.bal{font-size:34px;font-weight:700} [hidden]{display:none!important} body{padding-bottom:70px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<h1>Wallet</h1>
<p id="msg"></p>

<section id="authBox" class="card">
<div id="custAuth">
<h2>Sign in or create wallet</h2>
<input id="phone" value="0790928450" placeholder="0790928450">
<input id="name" value="Collins Letting" placeholder="Name">
<input id="pin" type="password" placeholder="PIN 123456">
<button id="loginBtn">Sign in</button>
<button id="regBtn" class="alt">Create wallet</button>
<button id="forgotLink" class="link">Forgot PIN? Reset</button>
<button id="toAdmin" class="alt">Admin sign in</button>
</div>
<div id="forgotBox" hidden>
<h2>Reset PIN</h2>
<input id="fPhone" value="0790928450">
<input id="fName" value="Collins Letting">
<input id="fNewPin" type="password" placeholder="New PIN 123456">
<button id="fResetBtn">RESET NOW</button>
<button id="fBack" class="alt">Back</button>
</div>
<div id="adminAuth" hidden>
<h2>Admin sign in</h2>
<p style="font-size:12px">Your Gmail collinsletting48@gmail.com is now admin!</p>
<input id="aemail" value="collinsletting48@gmail.com">
<input id="apass" type="password" placeholder="Your admin password">
<button id="adminBtn">Sign in as admin</button>
<button id="toCust" class="alt">Back</button>
</div>
</section>

<section id="custView" hidden>
<div class="card"><div id="who"></div><div class="bal">Ksh <span id="bal">0</span></div></div>
<button data-out class="alt">Sign out</button>
</section>

<section id="adminView" hidden>
<div class="card"><h2>Admin Panel - collinsletting48@gmail.com</h2>
<p style="font-size:13px;color:green">✅ You are admin! You can reset any PIN now.</p>
<input id="rPhone" value="0790928450" placeholder="Customer phone">
<input id="rPin" value="123456" placeholder="New PIN">
<button id="rBtn">Set PIN to 123456 for 0790928450</button>
<div id="adminList"></div>
</div>
<button data-out class="alt">Sign out</button>
</section>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyA3rqKiUrn1Tr7gvo03VMGYEzJgG2QGqtQ",
  authDomain: "amazinggracecomments-e68ea.firebaseapp.com",
  projectId: "amazinggracecomments-e68ea",
  storageBucket: "amazinggracecomments-e68ea.firebasestorage.app",
  messagingSenderId: "494112674814",
  appId: "1:494112674814:web:abc6a684436bf7490b26af"
});
const auth=firebase.auth(), fs=firebase.firestore();
const $=id=>document.getElementById(id);
const say=t=>{ $("msg").textContent=t; setTimeout(()=>{$("msg").textContent="";},4000); };
const mail=p=>p.trim()+"@collinspesa.app";
const PHONE=/^(07|01)\d{8}$/;
const FIXED_PASS="CollinsWallet2024!";
// FIXED: Your Gmail is now admin!
const ADMIN_EMAILS=["admin@collinspesa.app","collinsletting48@gmail.com","collinsletting48@gmail.com".toLowerCase()];

function show(v){ $("authBox").hidden=v!==null; $("custView").hidden=v!=="cust"; $("adminView").hidden=v!=="admin"; }
$("toAdmin").onclick=()=>{ $("custAuth").hidden=true; $("forgotBox").hidden=true; $("adminAuth").hidden=false; };
$("toCust").onclick=()=>{ $("custAuth").hidden=false; $("forgotBox").hidden=true; $("adminAuth").hidden=true; };
$("forgotLink").onclick=()=>{ $("custAuth").hidden=true; $("forgotBox").hidden=false; };
$("fBack").onclick=()=>{ $("custAuth").hidden=false; $("forgotBox").hidden=true; };

$("regBtn").onclick=async()=>{
  const phone=$("phone").value.trim(), name=$("name").value.trim(), pin=$("pin").value.trim();
  if(!PHONE.test(phone)||pin.length<6) return say("Phone 0790928450 + PIN 6 digits");
  try{
    const cred=await auth.createUserWithEmailAndPassword(mail(phone), FIXED_PASS);
    await fs.collection("wallets").doc(phone).set({phone,name,pin,balance:203,uid:cred.user.uid});
    say("✅ Created "+phone+" PIN "+pin);
  }catch(e){ say(e.code==="auth/email-already-in-use"?"Exists - use Forgot PIN":e.message); }
};

$("loginBtn").onclick=async()=>{
  const phone=$("phone").value.trim(), pin=$("pin").value.trim();
  try{
    await auth.signInWithEmailAndPassword(mail(phone), FIXED_PASS);
    const doc=await fs.collection("wallets").doc(phone).get();
    if(doc.data().pin!==pin){ await auth.signOut(); say("Wrong PIN - Real PIN is "+doc.data().pin); return; }
    say("✅ Signed in");
  }catch(e){ say("Try Forgot PIN to reset to 123456"); }
};

$("fResetBtn").onclick=async()=>{
  const phone=$("fPhone").value.trim(), newPin=$("fNewPin").value.trim();
  try{
    await fs.collection("wallets").doc(phone).update({pin:newPin});
    say("✅ PIN RESET to "+newPin+" for "+phone+" - Now Sign in!");
    $("forgotBox").hidden=true; $("custAuth").hidden=false;
    $("phone").value=phone; $("pin").value=newPin;
  }catch(e){ say("Failed: "+e.message); }
};

$("adminBtn").onclick=async()=>{
  const email=$("aemail").value.trim(), pass=$("apass").value;
  try{ await auth.signInWithEmailAndPassword(email, pass); }
  catch(e){ say("Wrong admin pass - Go to Firebase Console > Auth > Users > collinsletting48@gmail.com > Set password to Admin123456"); }
};

$("rBtn").onclick=async()=>{
  const phone=$("rPhone").value.trim(), pin=$("rPin").value.trim();
  try{ await fs.collection("wallets").doc(phone).update({pin}); say("✅ Admin set "+phone+" PIN to "+pin); }
  catch(e){ say(e.message); }
};

document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>auth.signOut());

auth.onAuthStateChanged(async u=>{
  show(null); if(!u) return;
  console.log("Logged in as", u.email);
  if(ADMIN_EMAILS.includes(u.email.toLowerCase())){
    show("admin");
    say("✅ Admin "+u.email+" signed in!");
    const snap=await fs.collection("wallets").get();
    const list=$("adminList"); list.innerHTML="<h3>Wallets:</h3>";
    snap.forEach(d=>{ const w=d.data(); const div=document.createElement("div"); div.className="row"; div.textContent=`${w.phone} ${w.name} PIN:${w.pin} Bal:${w.balance}`; list.appendChild(div); });
  }else{
    show("cust");
    const phone=$("phone").value.trim()||u.email.split("@")[0];
    fs.collection("wallets").doc(phone).onSnapshot(doc=>{ if(doc.exists){ const d=doc.data(); $("who").textContent=d.name+" · "+d.phone+" PIN:"+d.pin; $("bal").textContent=d.balance; } });
  }
});
</script>
</body>
</html>
