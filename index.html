<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collins-Pesa</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
body{background:#022c22;color:#eafff0;padding:12px;max-width:520px;margin:0 auto}
header{background:#16a34a;padding:14px;border-radius:16px;text-align:center}
.badge{padding:5px 12px;border-radius:20px;font-weight:bold;font-size:11px;margin:3px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.card{background:#0f5132;padding:12px;border-radius:14px;margin:12px 0;border:2px solid #16a34a}
.panel{background:#0f2a1f;padding:14px;border-radius:14px;margin:12px 0;border:1px solid #14532d}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:2px solid #14532d;font-size:15px}
button{background:#16a34a;color:white;font-weight:bold;border:none;cursor:pointer}
.log{background:#020617;padding:10px;border-radius:10px;max-height:200px;overflow:auto;font-size:12px}
.lockScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:#022c22;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.tab{display:flex;gap:8px;margin:12px 0}
.tab button{flex:1;padding:10px;font-size:13px;border-radius:10px}
.tab button.active{background:#facc15;color:#022c22}
</style>
</head>
<body>
<div id="loginScreen" class="lockScreen">
<div style="background:white;padding:22px;border-radius:20px;text-align:center;max-width:400px;width:100%;">
<h2 style="color:#16a34a;">💰 Collins-Pesa</h2>
<div style="height:20px"></div>
<div class="tab">
<button id="tabPhone" class="active" onclick="showTab('phone')">📱 Phone</button>
<button id="tabEmail" onclick="showTab('email')">🔒 Admin</button>
</div>

<div id="phoneTab">
<div style="height:20px"></div>
<input id="regPhone" placeholder="Your phone 0712...">
<input id="regName" placeholder="Your name">
<input id="regPin" type="password" inputmode="numeric" maxlength="4" placeholder="Create 4-digit PIN">
<button onclick="registerSelf()" style="background:#16a34a;">📱 Register</button>
<div style="height:20px"></div>
</div>

<div id="emailTab" style="display:none;">
<div style="height:20px"></div>
<input id="agentEmail" type="email" placeholder="Admin Email">
<input id="agentPassword" type="password" placeholder="Admin Password">
<input id="agentPin" type="password" inputmode="numeric" placeholder="Admin PIN">
<button onclick="agentEmailLogin()" style="background:#ef4444;">🔒 Login Admin</button>
<button onclick="agentEmailLoginTestMode()" style="background:#022c22;font-size:11px;">Test Mode - PIN Only</button>
<p id="emailError" style="color:red;display:none;font-size:10px;margin-top:8px;background:#fee2e2;padding:8px;border-radius:8px;"></p>
<div style="height:20px"></div>
</div>

</div>
</div>

<header>
<h1 id="headerTitle">💰 Collins-Pesa</h1>
<div><span class="badge" style="background:#facc15;color:#022c22;">Till 0790928450</span></div>
<div style="font-size:11px;margin-top:6px;">Logged: <span id="loggedUser">Not logged</span></div>
</header>

<div id="customerView" style="display:none;">
<div class="card"><h3>👋 Hello <span id="userName"></span></h3><div style="background:#022c22;padding:14px;border-radius:12px;margin:10px 0;text-align:center;"><div>YOUR Wallet</div><div style="font-size:32px;font-weight:bold;color:#facc15;">Ksh <span id="walletBalance">0</span></div></div></div>
<div class="card"><h3>💰 Add Money</h3><input id="addAmount" type="number" placeholder="Amount"><button onclick="addMoneyStep1()" style="background:#facc15;color:#022c22;">I Sent to Till</button><div id="addCodeDiv" style="display:none;"><input id="addCode" placeholder="Enter code QGH..."><button onclick="verifyAddMoney()">Verify</button></div></div>
<div class="card"><h3>📤 Send</h3><input id="sendTo" placeholder="Receiver"><input id="sendAmount" type="number" placeholder="Amount"><button onclick="sendDirect()">SEND</button></div>
<div id="status" class="log"></div><button onclick="logout()" style="background:#ef4444;margin-top:12px;">Logout</button>
</div>

<div id="adminView" style="display:none;">
<div class="grid"><div class="card">Float<br><b id="floatBalance">15000</b></div><div class="card">Cash<br><b id="cashBalance">8000</b></div><div class="card">Till<br><b id="tillReceived">0</b></div><div class="card">Profit<br><b id="todayProfit">Ksh 0</b></div></div>
<div class="panel"><h3>🔒 Withdraw</h3><input id="withdrawAmount" type="number" placeholder="Amount"><input id="withdrawTo" placeholder="Withdraw to"><input id="withdrawPin" type="password" placeholder="PIN"><button onclick="agentWithdraw()" style="background:#ef4444;">WITHDRAW</button></div>
<div class="panel"><h3>🔥 Firebase</h3><div>Firebase: <span id="firebaseStatus">Connecting...</span></div><div>Customers: <span id="userCount">0</span></div><div>Pending: <span id="pendingCount">0</span></div></div>
<div class="panel"><h3>📋 Log</h3><div id="log" class="log">READY</div></div>
<button onclick="logout()" style="background:#022c22;margin-top:12px;">Logout</button>
</div>

<script>
let currentAdminEmail=null,currentUser=null,pendingAddAmount=0;
function showTab(tab){document.getElementById('phoneTab').style.display=tab==='phone'?'block':'none';document.getElementById('emailTab').style.display=tab==='email'?'block':'none';document.getElementById('tabPhone').classList.toggle('active',tab==='phone');document.getElementById('tabEmail').classList.toggle('active',tab==='email');}
let floatBalance=15000,cashBalance=8000;
const firebaseConfig={apiKey:"AIzaSyA3rqKiUrn1Tr7gvo03VMGYEzJgG2QGqtQ",authDomain:"amazinggracecomments-e68ea.firebaseapp.com",databaseURL:"https://amazinggracecomments-e68ea-default-rtdb.firebaseio.com",projectId:"amazinggracecomments-e68ea",storageBucket:"amazinggracecomments-e68ea.firebasestorage.app",messagingSenderId:"1022295190612",appId:"1:1022295190612:web:4d848d31adfa1d6a8e2b9e7"};
firebase.initializeApp(firebaseConfig);const db=firebase.database(),auth=firebase.auth();
function registerSelf(){const phone=document.getElementById('regPhone').value.trim(),name=document.getElementById('regName').value.trim(),pin=document.getElementById('regPin').value.trim();if(!phone||!name||!pin||pin.length!==4){alert('Fill all');return;}db.ref('users/'+phone).set({phone,name,pin,balance:203}).then(()=>{currentUser={phone,name,pin,balance:203};localStorage.setItem('collins_full_user',JSON.stringify({...currentUser,role:'customer'}));showCustomerView();});}
function showCustomerView(){document.getElementById('loginScreen').style.display='none';document.getElementById('customerView').style.display='block';document.getElementById('adminView').style.display='none';document.getElementById('userName').textContent=currentUser.name;document.getElementById('loggedUser').textContent=currentUser.phone;db.ref('users/'+currentUser.phone+'/balance').on('value',snap=>{const bal=snap.val()||0;currentUser.balance=bal;document.getElementById('walletBalance').textContent=bal;});}
function agentEmailLogin(){const email=document.getElementById('agentEmail').value.trim(),password=document.getElementById('agentPassword').value.trim(),pin=document.getElementById('agentPin').value.trim();if(pin!=='0790928450'){alert('Wrong PIN - Use 0790928450');return;}auth.signInWithEmailAndPassword(email,password).then(()=>{currentAdminEmail=email;localStorage.setItem('collins_full_user',JSON.stringify({email,role:'admin'}));showAdminView();}).catch(e=>{document.getElementById('emailError').style.display='block';document.getElementById('emailError').textContent=e.message;});}
function agentEmailLoginTestMode(){const email=document.getElementById('agentEmail').value.trim()||'admin',pin=document.getElementById('agentPin').value.trim();if(pin!=='0790928450'){alert('Wrong PIN');return;}currentAdminEmail=email;localStorage.setItem('collins_full_user',JSON.stringify({email,role:'admin'}));showAdminView();}
function showAdminView(){document.getElementById('loginScreen').style.display='none';document.getElementById('customerView').style.display='none';document.getElementById('adminView').style.display='block';document.getElementById('loggedUser').textContent=currentAdminEmail;document.getElementById('floatBalance').textContent=floatBalance;document.getElementById('cashBalance').textContent=cashBalance;}
function addMoneyStep1(){const amount=parseInt(document.getElementById('addAmount').value);if(!amount){alert('Enter amount');return;}pendingAddAmount=amount;document.getElementById('addCodeDiv').style.display='block';}
function verifyAddMoney(){const code=document.getElementById('addCode').value.trim().toUpperCase();if(!code){alert('Enter code');return;}db.ref('usedCodes/'+code).once('value').then(snap=>{if(snap.exists()){alert('Used');return;}const newBalance=(currentUser.balance||0)+pendingAddAmount;db.ref('users/'+currentUser.phone).update({balance:newBalance}).then(()=>{db.ref('usedCodes/'+code).set({code,phone:currentUser.phone,amount:pendingAddAmount,time:new Date().toLocaleString()});currentUser.balance=newBalance;document.getElementById('walletBalance').textContent=newBalance;document.getElementById('addCodeDiv').style.display='none';});});}
function sendDirect(){const to=document.getElementById('sendTo').value.trim(),amount=parseInt(document.getElementById('sendAmount').value);if(!to||!amount){alert('Enter');return;}if((currentUser.balance||0)<amount){alert('Low');return;}const requestId='REQ_'+Date.now(),newBalance=currentUser.balance-amount;db.ref('users/'+currentUser.phone).update({balance:newBalance}).then(()=>{db.ref('requests/'+requestId).set({from:currentUser.phone,to:to,amount:amount,status:'PENDING'});});}
function agentWithdraw(){const amount=parseInt(document.getElementById('withdrawAmount').value),pin=document.getElementById('withdrawPin').value.trim();if(pin!=='0790928450'){alert('Wrong PIN');return;}floatBalance-=amount;document.getElementById('floatBalance').textContent=floatBalance;}
function logout(){localStorage.removeItem('collins_full_user');location.reload();}
db.ref('.info/connected').on('value',snap=>{document.getElementById('firebaseStatus').textContent=snap.val()?'✅ Connected':'❌ Offline';});
db.ref('users').on('value',snap=>{document.getElementById('userCount').textContent=snap.numChildren();});
db.ref('requests').on('value',snap=>{const all=snap.val()||{};const pending=Object.values(all).filter(r=>r.status==='PENDING');document.getElementById('pendingCount').textContent=pending.length;});
</script>
</body>
</html>
