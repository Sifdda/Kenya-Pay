<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallet - Download Fixed</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f3f6f1;--ink:#14231a;--card:#fff;--line:#cfd9cc;--green:#1f7a43;--amber:#b7791f}
*{box-sizing:border-box;margin:0} body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:460px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
input,button{width:100%;font:inherit;padding:11px;margin:5px 0;border-radius:8px;border:1px solid var(--line)}
button{background:var(--green);color:#fff;border:0;font-weight:600} button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)} button.link{background:transparent;color:var(--green);text-decoration:underline;border:0}
button.download{background:#0b5394;font-size:17px;padding:16px}
#msg{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:12px 16px;font-weight:600;background:var(--amber);color:#fff} #msg:empty{display:none}
[hidden]{display:none!important} body{padding-bottom:80px}
.bal{font-size:34px;font-weight:700} .row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<h1>Wallet</h1>

<!-- SIMPLE DOWNLOAD BUTTONS THAT WORK -->
<div class="card" style="background:#e8f0fe;border:2px solid #0b5394">
<h2 style="text-align:center">📲 Download to Phone</h2>
<button id="downloadBtn" class="download">⬇️ DOWNLOAD FILE - Click Here</button>
<button id="installBtn" class="alt">📱 Install as App Icon (Add to Home Screen)</button>
<p id="hint" style="font-size:12px;text-align:center;margin-top:8px;color:#666"></p>
</div>

<p id="msg"></p>

<section id="authBox" class="card">
<div id="custAuth">
<h2>Sign in or create a wallet</h2>
<input id="phone" placeholder="0790928450" value="0790928450">
<input id="name" placeholder="Collins Letting" value="Collins Letting">
<input id="pin" type="password" placeholder="PIN 6 digits 123456">
<button id="loginBtn">Sign in</button>
<button id="regBtn" class="alt">Create wallet</button>
<button id="forgotLink" class="link">Forgot PIN? Reset</button>
<button id="toAdmin" class="alt">Admin sign in</button>
</div>
<div id="forgotBox" hidden>
<h2>Reset PIN</h2>
<input id="fPhone" value="0790928450">
<input id="fName" value="Collins Letting">
<input id="fNewPin" type="password" placeholder="New PIN 123456">
<button id="fResetBtn">Set New PIN</button>
<button id="fBack" class="alt">Back</button>
</div>
<div id="adminAuth" hidden>
<h2>Admin sign in</h2>
<input id="aemail" placeholder="Admin email">
<input id="apass" type="password" placeholder="Password">
<button id="adminBtn">Sign in as admin</button>
<button id="toCust" class="alt">Back</button>
</div>
</section>

<section id="custView" hidden>
<div class="card"><div id="who"></div><div class="bal">Ksh <span id="bal">0</span></div></div>
<div class="card"><h2>Send money</h2><input id="to" placeholder="Receiver"><input id="amt" type="number" placeholder="Amount"><button id="sendBtn">Send</button></div>
<div class="card"><h2>History</h2><div id="hist"></div></div>
<button class="alt" data-out>Sign out</button>
</section>

<script>
// === SIMPLE DOWNLOAD THAT WORKS ON ALL PHONES ===
document.getElementById('downloadBtn').onclick = function() {
  try {
    // Get full HTML of page
    const html = `<!DOCTYPE html>\n` + document.documentElement.outerHTML;
    const blob = new Blob([html], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    
    // Create invisible link and click it
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = 'CollinsWallet.html';
    document.body.appendChild(a);
    a.click();
    
    // Cleanup
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);
    
    document.getElementById('msg').textContent = "✅ Downloaded! Check Downloads folder → Open CollinsWallet.html";
    document.getElementById('hint').textContent = "File saved to Downloads. Open Files app → Downloads → Tap file to open.";
    setTimeout(() => { document.getElementById('msg').textContent = ""; }, 5000);
  } catch(e) {
    // Fallback - open in new tab to save
    const html = document.documentElement.outerHTML;
    const dataUri = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);
    window.open(dataUri, '_blank');
    document.getElementById('msg').textContent = "Opened in new tab - Tap menu → Download page / Save";
  }
};

document.getElementById('installBtn').onclick = function() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const hint = document.getElementById('hint');
  if (isIOS) {
    hint.innerHTML = "<b>iPhone:</b> Tap Share button ⬆️ (box with arrow at bottom) → Scroll → <b>Add to Home Screen</b> → Add";
    document.getElementById('msg').textContent = "iPhone: Share → Add to Home Screen";
  } else {
    hint.innerHTML = "<b>Android:</b> Tap Chrome menu ⋮ (top right 3 dots) → <b>Add to Home screen</b> or <b>Install app</b> → Add";
    document.getElementById('msg').textContent = "Android: Menu ⋮ → Add to Home screen";
  }
  hint.style.display = "block";
  hint.style.background = "#fff3cd";
  hint.style.padding = "10px";
  hint.style.borderRadius = "8px";
};

firebase.initializeApp({
  apiKey: "AIzaSyA3rqKiUrn1Tr7gvo03VMGYEzJgG2QGqtQ",
  authDomain: "amazinggracecomments-e68ea.firebaseapp.com",
  databaseURL: "https://amazinggracecomments-e68ea-default-rtdb.firebaseio.com",
  projectId: "amazinggracecomments-e68ea",
  storageBucket: "amazinggracecomments-e68ea.firebasestorage.app",
  messagingSenderId: "494112674814",
  appId: "1:494112674814:web:abc6a684436bf7490b26af"
});
const auth=firebase.auth(), db=firebase.database();
const $=id=>document.getElementById(id);
const say=t=>{ $("msg").textContent=t; setTimeout(()=>{$("msg").textContent="";},6000); };
const mail=p=>p.trim()+"@collinspesa.app";
const PHONE=/^(07|01)\d{8}$/;
function show(v){ $("authBox").hidden=v!==null; $("custView").hidden=v!=="cust"; }
$("toAdmin").onclick=()=>{ $("custAuth").hidden=true; $("forgotBox").hidden=true; $("adminAuth").hidden=false; };
$("toCust").onclick=()=>{ $("custAuth").hidden=false; $("forgotBox").hidden=true; $("adminAuth").hidden=true; };
$("forgotLink").onclick=()=>{ $("custAuth").hidden=true; $("forgotBox").hidden=false; $("fPhone").value=$("phone").value; $("fName").value=$("name").value; };
$("fBack").onclick=()=>{ $("custAuth").hidden=false; $("forgotBox").hidden=true; };
$("regBtn").onclick=async()=>{
  const phone=$("phone").value.trim(), name=$("name").value.trim(), pin=$("pin").value.trim();
  if(!PHONE.test(phone)||!name||pin.length<6) return say("Enter 0790928450, Collins Letting, PIN 6");
  $("regBtn").disabled=true; say("Creating...");
  try{ const cred=await auth.createUserWithEmailAndPassword(mail(phone), pin); await db.ref("users/"+cred.user.uid).set({phone,name,balance:203,createdAt:Date.now()}); say("✅ Created! Balance 203"); }
  catch(e){ say(e.code==="auth/email-already-in-use"?"Exists - Sign in or Forgot PIN":e.message); } $("regBtn").disabled=false;
};
$("loginBtn").onclick=async()=>{
  const phone=$("phone").value.trim(), pin=$("pin").value.trim();
  if(!PHONE.test(phone)||pin.length<6) return say("Phone + PIN 6 digits");
  $("loginBtn").disabled=true; say("Signing...");
  try{ await auth.signInWithEmailAndPassword(mail(phone), pin); say("✅ Signed in"); }
  catch(e){ say("Wrong PIN. Use Forgot PIN"); } $("loginBtn").disabled=false;
};
$("fResetBtn").onclick=async()=>{
  const phone=$("fPhone").value.trim(), name=$("fName").value.trim(), newPin=$("fNewPin").value.trim();
  if(!PHONE.test(phone)||newPin.length<6) return say("Phone + PIN 6");
  try{ await db.ref("resetRequests").push({phone,name,newPin,at:Date.now()}); say("✅ Request saved! Delete user "+phone+"@collinspesa.app in Firebase Console then Create wallet with PIN "+newPin); }
  catch(e){ say(e.message); }
};
$("adminBtn").onclick=async()=>{ try{ await auth.signInWithEmailAndPassword($("aemail").value.trim(), $("apass").value); }catch(e){ say("Wrong admin"); } };
document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>auth.signOut());
$("sendBtn").onclick=async()=>{
  try{ const to=$("to").value.trim(), amount=Number($("amt").value); if(!PHONE.test(to)||!amount) return say("Enter receiver + amount"); const u=auth.currentUser; const snap=await db.ref("users/"+u.uid).get(); let bal=snap.val().balance; if(bal<amount+3) return say("Low balance "+bal); await db.ref("users/"+u.uid+"/balance").set(bal-(amount+3)); await db.ref("userTransfers/"+u.uid).push({to,amount,fee:3,status:"SENT",at:Date.now()}); say("✅ Sent "+amount+" to "+to); }catch(e){ say(e.message); }
};
auth.onAuthStateChanged(u=>{
  show(null); if(!u) return; show("cust");
  db.ref("users/"+u.uid).on("value",s=>{ const d=s.val(); if(d){ $("who").textContent=d.name+" · "+d.phone; $("bal").textContent=d.balance; } });
  db.ref("userTransfers/"+u.uid).limitToLast(20).on("value",s=>{ const h=$("hist"); h.innerHTML=""; if(!s.exists()){ h.innerHTML="No history"; return; } s.forEach(c=>{ const t=c.val(); const div=document.createElement("div"); div.className="row"; div.textContent=`- Ksh ${t.amount+t.fee} to ${t.to}`; h.appendChild(div); }); });
});
</script>
</body>
</html>
